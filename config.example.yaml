# Copy this file to config.yaml and adjust to your environment.
# config.yaml is gitignored.

# The folder to scan. Use forward slashes or escaped backslashes.
# Example (Windows): "C:/Users/me/Documents/MyDocs"
target_folder: ""

# Where the registry Excel file will be written (defaults to <target_folder>/registry.xlsx if empty).
registry_xlsx: ""

# LM Studio OpenAI-compatible server.
llm:
  base_url: "http://localhost:1234/v1"
  api_key: "lm-studio"          # LM Studio ignores the value but the field is required.
  model: "qwen/qwen3.5-9b"      # Must match the model identifier loaded in LM Studio.
  request_timeout_seconds: 600
  # Sampling
  temperature: 0.1
  top_p: 0.95
  top_k: 20
  presence_penalty: 1.5
  # Thinking-mode behavior
  thinking_default: false       # Fast first pass.
  thinking_on_low_quality: true # Re-run with thinking ON if quality_score < threshold.
  low_quality_threshold: 0.6
  # Output token cap (per LLM call). Must be large enough for reasoning + JSON.
  # 6144 leaves comfortable headroom inside an 8192-token context window
  # (was 4096; the smaller cap was getting eaten entirely by hidden
  # reasoning tokens on dense chunks, producing `(empty response)`).
  max_output_tokens: 6144
  # Total wall-clock time budget (seconds) for ALL LLM activity on a single
  # file (chunk calls + reduce, including retries). Different from
  # `request_timeout_seconds` (which is per HTTP request). When exceeded, the
  # file is marked 'error' with 'llm_total_timeout'. Default 3600 (1 hour)
  # caps how long a single stuck file can hold up the queue. Bump it for
  # repositories that legitimately need more time per file.
  per_file_timeout_seconds: 3600
  # Multi-modal (vision) settings for image files. When enabled=true,
  # image documents (.png, .jpg, .heic, ...) are sent to the LLM as a
  # base64-encoded image plus a small text hint (filename / EXIF). Set
  # enabled=false to keep the legacy text-only behaviour for images.
  vision:
    enabled: true
    # Optional override of the model name JUST for image documents.
    # Empty = reuse `llm.model`. Useful if you keep a fast text model
    # loaded for documents and a separate vision model for images.
    model: ""
    # Longest side, in pixels. Larger images are downscaled before
    # encoding so the payload stays bounded.
    max_image_dim: 1568
    # Cap on the encoded payload (bytes ~ 4 MiB). The encoder walks
    # down a quality ladder (JPEG only) and, if still over, halves
    # dimensions until it fits.
    max_bytes: 4194304
    jpeg_quality: 85
    # Send filename / folder / EXIF as a text hint alongside the image.
    # Strongly recommended: EXIF DateTimeOriginal carries info the
    # model can't see in pixels.
    include_text_hints: true
    # OpenAI vision "detail" hint: auto | low | high. Servers that
    # don't honor it ignore it harmlessly.
    detail: auto
    # If true and the vision call fails with HTTP 4xx (e.g. configured
    # model doesn't actually accept images), retry once text-only.
    fallback_to_text_on_error: true

# Text-extraction limits sent to the LLM (characters, not tokens).
# For SMALL documents the head + middle + tail of the document is concatenated
# and sent in a single LLM call. For LARGE documents the map-reduce strategy
# below kicks in: the FULL extracted text is split into chunks, each chunk is
# extracted with its own LLM call, and a final reduce LLM call consolidates
# the narrative fields. This way nothing is dropped on big files.
extract:
  head_chars: 12000
  middle_chars: 4000
  tail_chars: 4000
  # Skip files larger than this many bytes (0 = no limit).
  max_file_size_bytes: 0
  # Total time budget (seconds) for extracting text from a single file.
  # If exceeded, the file is marked 'error' with 'extraction_timeout' and
  # the worker moves on. 0 = disabled. Default: 300 (5 minutes).
  per_file_timeout_seconds: 300
  # Per-page time budget (seconds) for PDF extraction. Pages that exceed
  # this are skipped with a marker note (rest of the document still
  # processed). 0 = disabled. Default: 20.
  per_page_timeout_seconds: 20
  # Map-reduce strategy for large documents.
  mapreduce:
    # Master switch. If false, large docs use head+middle+tail sampling.
    enabled: true
    # Documents with extracted text longer than this go through chunked
    # extraction so every page/section is actually processed by the LLM.
    threshold_chars: 10000
    # Target chunk size in characters. 6 000 finishes more reliably
    # than 10 000 — at the larger size dense product-feature listings
    # blew past the per-chunk token budget and produced
    # `(empty response)` storms.
    chunk_chars: 6000
    # Overlap between consecutive chunks to avoid losing context across
    # page boundaries.
    chunk_overlap_chars: 500
    # Hard ceiling on chunk count; if exceeded, chunks are sampled
    # uniformly across the document to keep the LLM call count bounded.
    max_chunks: 200
    # Final reduce LLM call to consolidate narrative fields (title,
    # description, summary, etc.). If false, narrative fields are merged
    # deterministically (zero hallucination risk, less coherent output).
    reduce_with_llm: true
    # Output token cap for chunk extractions. 2048 leaves headroom
    # under the global llm.max_output_tokens=6144 cap and is enough for
    # the slightly richer entity lists the leak-aware prompt produces.
    per_chunk_max_output_tokens: 2048

# Which extensions to consider documents.
include_extensions:
  - .pdf
  - .docx
  - .pptx
  - .xlsx
  - .doc
  - .ppt
  - .xls
  - .txt
  - .md
  - .rtf
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .bmp
  - .tif
  - .tiff

# Folders to ignore (case-insensitive, glob-like).
ignore_dir_names:
  - ".git"
  - ".venv"
  - "node_modules"
  - "$RECYCLE.BIN"
  - "System Volume Information"
  - "__MACOSX"
  - ".obsidian"

# Excel write cadence: regenerate registry.xlsx every N completed files (and at end).
excel_write_every_n_files: 10

# Processing-related options.
processing:
  # If true, prevent the OS from sleeping while the worker is running.
  # On Windows this calls SetThreadExecutionState(ES_CONTINUOUS |
  # ES_SYSTEM_REQUIRED) so the system stays awake (display can still
  # turn off). The lock is released as soon as the worker finishes or
  # idles. On non-Windows platforms this is a no-op. Without this, a
  # laptop that sleeps mid-extraction typically kills the in-flight
  # file with llm_transport_error / extraction_timeout when it wakes.
  keep_awake_while_running: true
  # How often the worker logs an `[hb]` heartbeat line during long LLM
  # calls (visible in the Activity log at "verbose" verbosity). The UI
  # progress ticker still updates every 5s regardless of this value;
  # this only controls how often a heartbeat shows up in the persistent
  # log. 0 disables heartbeat log lines (UI ticker still ticks).
  # Default 120 (= every 2 minutes).
  heartbeat_log_interval_seconds: 120

# Web app
server:
  host: "127.0.0.1"
  port: 8000